<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>COZU 禮贈品提案系統</title>
<link rel="icon" type="image/png" href="https://img.shoplineapp.com/media/image_clips/6a83fb51d991dcebcf099607/original.png?1787034449=&owner_id=58c5132a59d524173800069b" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Mulish:wght@400;500;600;700&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root {
  /* ── Color: Text ── */
  --color-text-primary:   #232A31;
  --color-text-secondary: #4a4e5b;
  --color-text-tertiary:  #848B91;

  /* ── Color: Background ── */
  --color-bg:             #ffffff;
  --color-bg-page:        #fafafa;
  --color-bg-subtle:      #f7f7f7;
  --color-bg-hover:       #f0f0f0;

  /* ── Color: Border ── */
  --color-border:         #e5e5e5;

  /* ── Layout ── */
  --radius:  7px;
  --rail:    220px;
  --font:    "Mulish","Noto Sans TC",-apple-system,BlinkMacSystemFont,sans-serif;

  /* ── Legacy aliases（勿刪，維持舊樣式正常運作）── */
  --bg:      var(--color-bg);
  --bg-soft: var(--color-bg-subtle);
  --ink:     var(--color-text-primary);
  --ink-2:   var(--color-text-tertiary);
  --line:    var(--color-border);
  --hover:   var(--color-bg-hover);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; }
html { overflow-y: scroll; scrollbar-gutter: stable; }
body {
  font-family: var(--font);
  font-size: 13px;
  line-height: 1.55;
  color: var(--ink);
  background: var(--color-bg-page);
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; }
a { color: inherit; text-decoration: none; }

/* ── Topbar ── */
.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.topbar-inner {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 20px;
}
.topbar-row1 {
  display: flex;
  align-items: center;
  height: 48px;
  gap: 12px;
}
.brand { display: flex; align-items: center; gap: 8px; }
.brand-name { font-size: 15px; font-weight: 700; letter-spacing: .01em; }
.brand-sub { font-size: 11px; color: var(--ink-2); }
.brand-text { display: flex; flex-direction: column; justify-content: center; }
.brand-sub-en {
  font-family: "Space Grotesk", var(--font);
  font-size: 8px;
  font-weight: 400;
  color: var(--color-text-tertiary);
  letter-spacing: .08em;
  margin-top: 1px;
}
.topbar-links { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.topbar-link-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--color-text-secondary);
  background: none;
  border: 1px solid var(--color-border);
  border-radius: 4px;
  padding: 4px 10px;
  text-decoration: none;
  white-space: nowrap;
  transition: background .1s, color .1s, border-color .1s;
}
.topbar-link-btn:hover { background: var(--color-bg-hover); color: var(--color-text-primary); border-color: #d0d0d0; }
.topbar-link-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

/* ── Tabs row ── */
.tabs-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.tabs { display: flex; gap: 20px; }
.topbar-meta { font-size: 11px; color: var(--ink-2); padding-bottom: 10px; }
.tab {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 12px;
  margin-left: -12px;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-2);
  letter-spacing: .03em;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  white-space: nowrap;
  transition: color .1s, border-color .1s;
}
.tab svg { width: 14px; height: 14px; }
.tab.active { color: #345D73; font-weight: 700; border-bottom-color: #345D73; }
.tab.disabled { color: #ccc; cursor: default; }
/* 2026-07-20：禮盒／獎座 tab 暫時隱藏（程式碼保留，要恢復顯示只需刪除下面這一行） */
.tab.disabled { display: none; }
.tab:not(.active):not(.disabled):hover { color: var(--ink); }
.soon {
  font-size: 9px;
  color: #bbb;
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 1px 5px;
}

/* ── Shell ── */
.shell {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 28px 80px;
  display: grid;
  grid-template-columns: var(--rail) 1fr;
  gap: 32px;
  align-items: start;
}

/* ── Rail ── */
.rail {
  position: sticky;
  top: 106px; /* 備援值，實際值由 JS 依 topbar 實際高度動態設定 */
  padding: 24px 0;
}
.rail-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.rail-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--ink-2);
}
.clear-btn {
  font-size: 11px;
  color: var(--ink-2);
  background: none;
  border: none;
  padding: 2px 4px;
  border-radius: 4px;
}
.clear-btn:hover:not(:disabled) { color: var(--ink); background: var(--hover); }
.clear-btn:disabled { opacity: .35; cursor: default; }

.fgroup { padding: 13px 0; border-top: 1px solid var(--line); }
.fgroup-title {
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.fgroup-title.collapsible {
  margin-bottom: 0;
  cursor: pointer;
  user-select: none;
}
.fgroup-title.collapsible .fgroup-arrow {
  width: 14px;
  height: 14px;
  color: var(--ink-2);
  transition: transform .2s;
  flex-shrink: 0;
  transform: rotate(90deg);
}
.fgroup.collapsed .fgroup-title.collapsible .fgroup-arrow { transform: rotate(0deg); }
.fgroup-body { overflow: hidden; }
.fgroup.collapsible .fgroup-body { padding-top: 8px; }
.fgroup.collapsed .fgroup-body { display: none; }

/* checkbox options */
.opt {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 3px 0;
  font-size: 12px;
  cursor: pointer;
  user-select: none;
}
.opt:hover .box { border-color: var(--ink); }
.box {
  width: 14px;
  height: 14px;
  border: 1px solid #c8c8c8;
  border-radius: 3px;
  background: #fff;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.opt.on .box { background: var(--ink); border-color: var(--ink); }
.opt.on .box::after {
  content: '';
  display: block;
  width: 7px;
  height: 4px;
  border-left: 1.5px solid #fff;
  border-bottom: 1.5px solid #fff;
  transform: rotate(-45deg) translate(0px, -1px);
}
.opt-cnt { margin-left: auto; font-size: 10px; color: #bbb; }

/* chip options */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font-size: 12px;
  padding: 3px 10px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--bg);
  color: var(--ink);
  white-space: nowrap;
}
.chip:hover { background: var(--hover); }
.chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }

/* ── Content ── */
.content { padding: 20px 0; }

.res-bar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 4px;
  min-height: 28px;
}
.res-count { font-size: 13px; color: var(--ink); white-space: nowrap; }
.res-count b { font-weight: 700; }
/* res-remark 已於 2026-07-20 移除：基準說明併入預算橫幅標題（#budgetBasis） */

/* ── 客戶單品預算橫幅 ── */
.budget-banner {
  position: sticky;
  top: 106px;              /* 備援值，實際值由 JS 依 topbar 實際高度動態設定 */
  z-index: 5;              /* 低於 topbar(10) */
  border-radius: 8px;
  padding: 0 20px;
  margin-bottom: 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  transition: padding .2s ease, border-radius .2s ease, box-shadow .2s ease;
}
.budget-banner-title {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 700;
  color: #232A31;
  cursor: pointer;
  user-select: none;
}
.budget-banner-title svg { width: 15px; height: 15px; color: inherit; }
/* 基準說明（2026-07-20：原 res-remark 併入，常駐顯示目前價格基準）；
   2026-08-19：加 opacity transition，MOQ 切換文字內容時用 fade 取代原本的整塊背景閃動 */
.budget-basis-sep { color: var(--ink-2); font-weight: 400; }
.budget-basis { font-size: 12px; font-weight: 400; color: var(--ink-2); transition: opacity .15s ease; }
.budget-basis.fading { opacity: 0; }
/* 展開/收合箭頭（2026-08-19：使用者可隨時手動展開，不再只綁 MOQ）：
   預設（展開狀態）朝上，collapsed 時朝下，跟 fgroup-arrow 的方向語意一致（下＝可點開） */
.budget-banner-arrow {
  width: 16px;
  height: 16px;
  color: var(--ink-2);
  transition: transform .2s;
  flex-shrink: 0;
  transform: rotate(180deg);
  margin-left: 2px;
}
.budget-banner.collapsed .budget-banner-arrow { transform: rotate(0deg); }
.budget-banner-chips { justify-content: center; }
.budget-banner .chip { background: #fff; padding: 5px 14px; font-size: 12px; }
.budget-banner .chip.on { background: var(--ink); border-color: var(--ink); }
/* 2026-08-26 新增：原本 .chip:hover 因優先權打平被 .budget-banner .chip 的 background:#fff 蓋掉，
   一直沒有 hover 效果；這裡明確指定 .budget-banner 範圍內的 hover／選中狀態，不再依賴撰寫順序 */
.budget-banner .chip:hover { background: var(--hover); }
.budget-banner .chip.on:hover { background: var(--ink); border-color: var(--ink); }
/* 吸頂時縮薄：隱藏名稱與圖示、保留基準小字（2026-07-20 修訂：原版整行標題藏掉，
   捲動深處反而失去「眼前價格是什麼基準」的脈絡，故改為只藏名稱）*/
.budget-banner.stuck { background: #fff; padding: 12px 20px; border-radius: 0; box-shadow: 0 4px 12px rgba(0,0,0,.03); }
.budget-banner.stuck .budget-basis-sep,
.budget-banner.stuck .budget-basis { display: none; }
/* 收合狀態（2026-08-19：預設收合，由 budgetBannerOpen 這個變數手動控制，見 JS；
   選具體 MOQ 時會連動自動展開、切回不限自動收合，但箭頭可隨時覆寫，兩者脫鉤）*/
.budget-banner.collapsed .budget-banner-chips,
.budget-banner.collapsed .budget-basis-sep,
.budget-banner.collapsed .budget-basis { display: none; }

/* 卡片排序（2026-08-26 新增；同日改版：兩顆共用一組容器，中間分隔線，
   而非各自獨立方框——外框 var(--color-border)、圓角 2px 只在左右外側、
   交接處直角；hover 沿用跟 budget-banner chip 一致的 var(--hover) 灰底，
   選中中的按鈕 hover 時維持選中色，不被灰底蓋掉）*/
.sort-row {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 12px;
}
.sort-toggle-group {
  display: flex;
  border: 1px solid var(--color-border);
}
.sort-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 32px;
  padding: 0;
  border: none;
  background: #fff;
  color: var(--ink-2);
  cursor: pointer;
  transition: color .15s ease, background .15s ease;
}
.sort-btn:first-child { border-radius: 2px 0 0 2px; }
.sort-btn:last-child {
  border-radius: 0 2px 2px 0;
  border-left: 1px solid var(--color-border);
}
.sort-btn:hover:not(.active) { background: var(--hover); }

.sort-btn svg { width: 18px; height: 18px; display: block; color: inherit; }
.sort-btn.active { color: #345D73; }

/* 選定 MOQ 但商品無對應級距報價的標註（視覺樣式第一版，待 Can 調整）*/
.card-price-noquote {
  font-size: 12px;
  font-weight: 400;
  color: #345D73;
  letter-spacing: .02em;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.card-price-noquote svg { width: 14px; height: 14px; flex-shrink: 0; color: inherit; }
.active-chips { display: flex; flex-wrap: wrap; gap: 5px; }
.achip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--ink-2);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 2px 4px 2px 8px;
  white-space: nowrap;
}
.achip button {
  border: none;
  background: none;
  color: #bbb;
  font-size: 13px;
  line-height: 1;
  padding: 0 2px;
  border-radius: 50%;
}
.achip button:hover { color: var(--ink); }

/* ── Grid ── */
/* 2026-08-14：一排 3 → 4 個實驗性調整（僅桌機使用，先試視覺效果） */
.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px 12px;
}
@media (max-width: 1300px) { .grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 1000px) { .grid { grid-template-columns: repeat(2, 1fr); } }

/* ── Card ── */
.card {
  position: relative;
  border: 0;
  border-radius: var(--radius);
  background: var(--color-bg);
  box-shadow: 0 0 0 1px transparent, 2px 4px 12px #00000005;
  overflow: hidden;
  cursor: pointer;
  text-align: left;
  transition: background .1s, box-shadow .15s ease;
  display: flex;
  flex-direction: column;
}
.card:hover { box-shadow: 0 0 0 1px transparent, 2px 4px 20px #00000010; }
.card.selected { box-shadow: 0 0 0 1px var(--ink), 2px 4px 12px #00000005; }
.card.selected:hover { box-shadow: 0 0 0 1px var(--ink), 2px 4px 20px #00000010; }

/* card checkbox */
.card-checkbox {
  position: absolute;
  top: 8px;
  left: 8px;
  width: 20px;
  height: 20px;
  border-radius: 4px;
  border: 1px solid #c8c8c8;
  background: rgba(255,255,255,.92);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
  opacity: 0;
  pointer-events: none;
  transition: opacity .18s ease-in-out, background .1s, border-color .1s;
}
.card:hover .card-checkbox,
.card-checkbox.on {
  opacity: 1;
  pointer-events: auto;
}
.card-checkbox:hover { border-color: var(--ink); }
.card-checkbox.on { background: var(--ink); border-color: var(--ink); }
.card-checkbox.on::after {
  content: '';
  display: block;
  width: 9px;
  height: 5px;
  border-left: 1.5px solid #fff;
  border-bottom: 1.5px solid #fff;
  transform: rotate(-45deg) translate(1px, -1px);
}

.card-img {
  aspect-ratio: 4/3;
  background: var(--bg-soft);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
}
.card-img::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0);
  transition: background .18s ease-in-out;
  pointer-events: none;
  z-index: 1;
}
.card:hover .card-img::after,
.card.selected .card-img::after {
  background: rgba(0,0,0,.2);
}
.card-img img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.card-body { padding: 12px 12px 8px 12px; flex: 1; display: flex; flex-direction: column; }
.card-name-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
.card-name { font-size: 14px; font-weight: 600; line-height: 1.4; color: var(--color-text-primary); }
.card-name-mats { display: flex; gap: 3px; flex-wrap: wrap; align-items: center; }
.card-price { margin-bottom: 12px; }
.card-price-row { display: flex; align-items: baseline; gap: 8px; }
.card-price-main { font-size: 13px; font-weight: 700; color: var(--color-text-primary); }
.card-price-min { font-size: 10px; font-weight: 700; color: var(--ink-2); }
.card-price-note { font-size: 10px; font-weight: 400; color: var(--ink-2); margin-top: 2px; line-height: 1.4; }
.card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.mtag {
  font-size: 10px;
  color: var(--ink-2);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 1px 6px;
  white-space: nowrap;
}
.mtag-mat {
  background: #fff;
  color: var(--color-text-secondary);
  border-color: var(--color-border);
  border-radius: 2px;
  padding: 0 4px 2px 4px;
}
.card-meta {
  font-size: 11px;
  color: var(--ink-2);
  display: flex;
  align-items: center;
  gap: 2px;
  flex-wrap: wrap;
}
.meta-sep { color: var(--line); }
/* 2026-08-20 新增：卡片「大量訂購」標記，用跟 price-tier-row-active 一致的金色系，
   跟中性灰的 .mtag 區隔開，提示這是需要特別注意的狀態 */
.moq-bulk-badge {
  font-size: 10px;
  font-weight: 400;
  color: #b08d57;
  white-space: nowrap;
}
.card-tag-row {
  margin-top: 8px;
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.deal-badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 10px;
  color: var(--ink-2);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 1px 6px;
}
.deal-badge svg { width: 9px; height: 9px; }

/* ── Empty / Error ── */
.empty {
  border: 1px dashed var(--line);
  border-radius: 10px;
  padding: 60px 24px;
  text-align: center;
  color: var(--ink-2);
}
.empty h4 { font-size: 14px; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
.empty p { font-size: 12px; margin-bottom: 16px; }
.empty-btn {
  border: 1px solid var(--line);
  background: var(--bg);
  border-radius: 6px;
  padding: 7px 16px;
  font-size: 12px;
}
.empty-btn:hover { background: var(--hover); }

.error {
  text-align: center;
  padding: 60px 24px;
  color: var(--ink-2);
}
.error-title { font-size: 14px; font-weight: 700; color: #c0392b; margin-bottom: 6px; }
.error-msg { font-size: 11px; }

.loading {
  text-align: center;
  padding: 80px 24px;
  color: var(--ink-2);
  font-size: 13px;
}
.spinner {
  display: inline-block;
  width: 14px; height: 14px;
  border: 1px solid var(--line);
  border-top-color: var(--ink);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  vertical-align: middle;
  margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Access Gate（密語輸入門檻，A 方案，2026-08-21 新增）── */
.gate-overlay {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: var(--color-bg-page);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.gate-box {
  width: 100%;
  max-width: 320px;
  padding: 32px 28px;
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}
.gate-logo { width: 81px; height: 20px; object-fit: contain; margin-bottom: 12px; }
.gate-title {
  font-size: 14px;
  font-weight: 400;
  letter-spacing: 0.01em;
  color: var(--color-text-primary);
  margin-bottom: 24px;
}
.gate-checking {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 0;
  color: var(--color-text-tertiary);
  font-size: 12px;
}
.gate-form { width: 100%; }
.gate-sub {
  font-size: 12px;
  color: var(--color-text-tertiary);
  margin-bottom: 16px;
}
.gate-input-wrap { position: relative; width: 100%; }
.gate-input {
  width: 100%;
  padding: 8px 36px 8px 12px;
  font-size: 13px;
  font-family: var(--font);
  color: var(--color-text-primary);
  border: 1px solid var(--color-border);
  border-radius: 4px;
  outline: none;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
.gate-input:focus { border-color: #345D73; }
.gate-toggle {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  border: none;
  background: none;
  color: var(--color-text-tertiary);
}
.gate-toggle:hover { color: var(--color-text-primary); }
.gate-toggle svg { width: 16px; height: 16px; display: block; }
.gate-error {
  font-size: 12px;
  color: #c0392b;
  text-align: left;
  margin-top: 6px;
}
.gate-submit {
  width: 100%;
  padding: 8px 0;
  margin-top: 16px;
  font-size: 13px;
  font-weight: 600;
  color: #fff;
  background: #345D73;
  border: none;
  border-radius: 4px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
.gate-submit:hover:not(:disabled) { background: #2a4c5e; }
.gate-submit:disabled { opacity: .6; cursor: default; }

/* ⚠️ 測試用「清除密語」按鈕（上線前刪除）：連同下面 .dev-gate-reset 這個
   CSS block，以及 HTML 裡 id="devGateReset" 的按鈕、JS 裡的 devClearGateToken()
   函式，三處一起刪除即可完整移除，不影響正式邏輯 */
.dev-gate-reset {
  position: fixed;
  right: 12px;
  bottom: 12px;
  z-index: 210;
  font-size: 10px;
  color: var(--color-text-tertiary);
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  border-radius: 4px;
  padding: 4px 8px;
  opacity: .55;
}
.dev-gate-reset:hover { opacity: 1; color: var(--color-text-primary); }

/* ── Slide-over ── */
.scrim {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.15);
  z-index: 40;
  animation: fadeIn .15s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.peek {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: 420px;
  max-width: 92vw;
  background: var(--bg);
  border-left: 1px solid var(--line);
  z-index: 50;
  display: flex;
  flex-direction: column;
  animation: slideIn .2s ease;
}
@keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

.peek-head {
  display: flex;
  align-items: center;
  padding: 13px 16px;
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.peek-label { font-size: 12px; color: var(--color-text-secondary); font-weight: 600; letter-spacing: .04em; }
.peek-close {
  margin-left: auto;
  width: 28px; height: 28px;
  border: none;
  background: none;
  color: var(--ink-2);
  font-size: 16px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.peek-close:hover { background: var(--hover); color: var(--ink); }

.peek-body { overflow-y: auto; padding: 18px; flex: 1; }

.peek-img {
  aspect-ratio: 4/3;
  background: var(--bg-soft);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
.peek-img img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: var(--radius);
}

.peek-name { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.peek-price { margin-bottom: 2px; }
.peek-price-row { display: flex; align-items: baseline; gap: 8px; }
.peek-price-main { font-size: 15px; font-weight: 700; }
.peek-price-min { font-size: 11px; font-weight: 700; color: var(--ink-2); }
.peek-price-note { font-size: 12px; font-weight: 400; color: var(--ink-2); margin-top: 3px; line-height: 1.5; }
.peek-price-remark { font-size: 12px; font-weight: 400; color: var(--ink); margin-top: 16px; line-height: 1.8; }

/* 報價級距表格 */
.price-tier-table {
  margin-top: 8px;
  border: 1px solid var(--line);
  border-radius: 6px;
  overflow: hidden;
}
.price-tier-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 12px;
  font-size: 12px;
  border-bottom: 1px solid var(--line);
}
.price-tier-row:last-of-type { border-bottom: none; }
.price-tier-qty { color: var(--ink-2); }
.price-tier-price { font-weight: 600; color: var(--ink); }
/* 2026-07-20：高亮目前選定 MOQ 對應的級距列，跟上方主要價格對照 */
.price-tier-row-active { background: #faf5f0; }
.price-tier-row-active .price-tier-qty { color: #b08d57; font-weight: 700; }
.price-tier-row-active .price-tier-price { color: #b08d57; }
.price-tier-more {
  display: block;
  padding: 7px 12px;
  font-size: 12px;
  border-top: 1px dashed var(--line);
  background: var(--bg-soft);
  color: var(--ink-2);
  text-decoration: none;
}
/* 卡片裡若只出現這一行（沒有上方價格級距列可分隔），拔掉分隔虛線 */
.price-tier-more:only-child { border-top: none; }
.price-tier-more:hover { color: var(--ink); }
.price-tier-more-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.dl { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; }
.dl-title {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--ink-2);
  margin-bottom: 10px;
}
.dl-row { display: flex; gap: 12px; font-size: 12px; padding: 3px 0; }
.dl-key { width: 80px; flex-shrink: 0; color: var(--ink-2); }
.dl-val { color: var(--ink); flex: 1; }

.pills { display: flex; flex-wrap: wrap; gap: 4px; }
.pill {
  font-size: 10px;
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 2px 8px;
  color: var(--ink-2);
}

/* deals */
.deal-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  padding: 8px;
  border-bottom: 1px dashed var(--line);
}
.deal-row:last-child { border-bottom: none; }
.deal-co { font-weight: 500; color: var(--ink); }
.deal-occ { color: var(--ink-2); }
.deal-yr { margin-left: auto; font-size: 10px; color: var(--ink-2); white-space: nowrap; }
.deal-selected-badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 10px;
  font-weight: 600;
  color: #2d7a3a;
  white-space: nowrap;
}
.deal-empty { font-size: 12px; color: #bbb; padding: 6px 0; }

/* card proposal meta */
.meta-selected {
  color: var(--ink);
  font-weight: 600;
}
.meta-selected-check {
  font-size: 11px;
}

/* NAS */
.nas-box {
  background: var(--bg-soft);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 9px 11px;
  font-size: 11px;
  color: var(--ink);
  font-family: "Mulish", monospace;
  word-break: break-all;
  display: flex;
  align-items: flex-start;
  gap: 8px;
}
.nas-path { flex: 1; }
.copy-btn {
  flex-shrink: 0;
  border: 1px solid var(--line);
  background: var(--bg);
  border-radius: 5px;
  font-size: 10px;
  padding: 3px 8px;
  color: var(--ink-2);
}
.copy-btn:hover { background: var(--hover); color: var(--ink); }

.slide-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px 12px;
  margin-top: 8px;
  color: var(--ink);
}
.slide-link:hover { background: var(--hover); }
.slide-link svg { width: 13px; height: 13px; }

.peek-note {
  font-size: 10px;
  color: #bbb;
  margin-top: 10px;
  line-height: 1.5;
}

/* coming soon */
.soon-panel {
  border: 1px dashed var(--line);
  border-radius: 10px;
  padding: 80px 24px;
  text-align: center;
  color: var(--ink-2);
}
.soon-panel h4 { font-size: 15px; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
.soon-panel p { font-size: 12px; }

/* ── Bottom Bar ── */
.bottom-bar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 30;
  background: var(--bg);
  border-top: 1px solid var(--line);
  box-shadow: 0 -4px 12px rgba(0,0,0,.05);
  transform: translateY(100%);
  transition: transform .2s ease;
  pointer-events: none;
}
.bottom-bar.show {
  transform: translateY(0);
  pointer-events: auto;
}
.bottom-bar-inner {
  max-width: 1280px;
  margin: 0 auto;
  padding: 16px 28px;
  display: grid;
  grid-template-columns: var(--rail) 1fr;
  gap: 32px;
  align-items: center;
}
.bottom-bar-content {
  display: flex;
  align-items: center;
  gap: 16px;
}
.bottom-bar-count { font-size: 13px; font-weight: 600; color: var(--ink); }
.bottom-bar-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 16px;
}
.bottom-bar-clear {
  font-size: 12px;
  color: var(--ink-2);
  background: none;
  border: none;
  padding: 4px 2px;
  text-decoration: underline;
  text-underline-offset: 2px;
}
.bottom-bar-clear:hover { color: var(--ink); }
.bottom-bar-export {
  font-size: 12px;
  font-weight: 600;
  color: #fff;
  background: var(--ink);
  border: none;
  border-radius: 6px;
  padding: 8px 20px;
}
.bottom-bar-export:disabled {
  background: #d8d8d8;
  color: #999;
  cursor: not-allowed;
}
.bottom-bar-customer {
  font-size: 13px;
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px 12px;
  width: 180px;
}
.bottom-bar-customer::placeholder { color: var(--ink-2); }
.bottom-bar-customer:focus { outline: none; border-color: var(--ink); }
.bottom-bar-toast {
  position: fixed;
  left: 50%;
  bottom: 84px;
  transform: translateX(-50%);
  background: #fff5f5;
  border: 1px solid #e2a4a4;
  color: #a33;
  font-size: 12px;
  font-weight: 600;
  padding: 10px 16px;
  border-radius: 6px;
  box-shadow: 0 4px 12px rgba(0,0,0,.08);
  z-index: 40;
  display: none;
}
.bottom-bar-toast.show { display: block; }

body.has-bottom-bar .shell { padding-bottom: 160px; }
</style>
</head>
<body>

<!-- ════════ ACCESS GATE（密語輸入門檻，A 方案，2026-08-21 新增）════════ -->
<div class="gate-overlay" id="gateOverlay">
  <div class="gate-box">
    <img src="https://img.shoplineapp.com/media/image_clips/6a742e87221273325fe03d6b/original.png?1785998983=&owner_id=58c5132a59d524173800069b" alt="COZU" class="gate-logo" />
    <div class="gate-title">禮贈品提案系統</div>

    <div class="gate-checking" id="gateChecking">
      <span class="spinner"></span>正在驗證身份…
    </div>

    <div class="gate-form" id="gateForm" style="display:none">
      <div class="gate-sub">輸入密碼以繼續</div>
      <div class="gate-input-wrap">
        <input type="password" id="gateInput" class="gate-input" placeholder="密碼" autocomplete="off" />
        <button type="button" class="gate-toggle" id="gateToggle" onclick="toggleGatePassword()" aria-label="顯示密碼" tabindex="-1">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M19.5 16L17.0248 12.6038" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M12 17.5V14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M4.5 16L6.96895 12.6124" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M3 8C6.6 16 17.4 16 21 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </button>

  </div>
</div>

<!-- ⚠️ 測試用「清除密語」按鈕（上線前刪除，見上方 CSS 註解說明三處位置） -->
<button class="dev-gate-reset" id="devGateReset" onclick="devClearGateToken()">清除密語（測試用）</button>

<!-- ════════ TOPBAR ════════ -->
<div class="topbar">
  <div class="topbar-inner">
    <div class="topbar-row1">
      <div class="brand" style="gap:16px;">
        <img src="https://img.shoplineapp.com/media/image_clips/6a742e87221273325fe03d6b/original.png?1785998983=&owner_id=58c5132a59d524173800069b" alt="COZU" style="width:81px;height:20px;object-fit:contain;" />
        <div class="brand-text">
          <span class="brand-sub" style="font-size:12px;color:var(--color-text-primary);font-weight:400;letter-spacing:.03em;">禮贈品提案系統</span>
          <span class="brand-sub-en">CORPORATE GIFT PROPOSAL SYSTEM</span>
        </div>
      </div>
      <div class="topbar-links">
        <a class="topbar-link-btn" href="https://cozutw.github.io/internal-proposal-system/cozu-sop.html" target="_blank" rel="noopener noreferrer">
          <svg width="16" height="16" viewBox="0 0 24 24" stroke-width="1.5" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor"><path d="M7 2L16.5 2L21 6.5V19" stroke-linecap="round" stroke-linejoin="round"></path><path d="M3 20.5V6.5C3 5.67157 3.67157 5 4.5 5H14.2515C14.4106 5 14.5632 5.06321 14.6757 5.17574L17.8243 8.32426C17.9368 8.43679 18 8.5894 18 8.74853V20.5C18 21.3284 17.3284 22 16.5 22H4.5C3.67157 22 3 21.3284 3 20.5Z" stroke-linecap="round" stroke-linejoin="round"></path><path d="M14 5V8.4C14 8.73137 14.2686 9 14.6 9H18" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          樣品上架步驟
        </a>
        <a class="topbar-link-btn" href="https://drive.google.com/drive/u/1/folders/1IsYlGgWgC4xDF9E9Q98L0jMMghd6hhTt" target="_blank" rel="noopener noreferrer">
          <svg width="16" height="16" stroke-width="1.5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor"><path d="M9.14286 3.00375L14.8571 3M9.14286 3.00375L2 15.0038M9.14286 3.00375L18.4321 21M14.8571 3L22 15.0038M14.8571 3L5.575 21M18.4321 21H5.575M18.4321 21L22 15.0038M5.575 21L2 15.0038M22 15.0038L2 15.0038" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          業務雲端簡報
        </a>
      </div>
    </div>
    <div class="tabs-row">
      <div class="tabs">
        <button class="tab active" data-tab="gift" onclick="switchTab('gift')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 12v9H4v-9"/><path d="M2 7h20v5H2z"/><path d="M12 22V7"/>
            <path d="M12 7S11 3 8.5 3 5 5 5 5s.5 2 3 2"/><path d="M12 7s1-4 3.5-4S19 5 19 5s-.5 2-3 2"/>
          </svg>
          禮贈商品
        </button>
        <button class="tab disabled">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>
          </svg>
          禮盒 <span class="soon">開發中</span>
        </button>
        <button class="tab disabled">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/>
            <path d="M7 5H4v2a3 3 0 0 0 3 3M17 5h3v2a3 3 0 0 1-3 3"/>

          獎座 <span class="soon">開發中</span>
        </button>
      </div>
      <span class="topbar-meta" id="lastUpdated"></span>
    </div>
  </div>
</div>

<!-- ════════ SHELL ════════ -->
<div class="shell">

  <!-- ── Rail ── -->
  <aside class="rail" id="railGift">
    <div class="rail-head">
      <span class="rail-title">篩選條件</span>
      <button class="clear-btn" id="clearBtn" onclick="clearAll()" disabled>清除篩選</button>
    </div>

    <!-- MOQ（2026-07-20 改版：第一層篩選，精確訂購數量；移至 rail 第一位）-->
    <div class="fgroup">
      <div class="fgroup-title">訂購數量</div>
      <div class="chips" id="moqChips">
        <button class="chip on" data-moq="all" onclick="pickMoq('all')">不限</button>
        <button class="chip" data-moq="50"   onclick="pickMoq('50')">50件</button>
        <button class="chip" data-moq="100"  onclick="pickMoq('100')">100件</button>
        <button class="chip" data-moq="200"  onclick="pickMoq('200')">200件</button>
        <button class="chip" data-moq="300"  onclick="pickMoq('300')">300件</button>
        <button class="chip" data-moq="500"  onclick="pickMoq('500')">500件</button>
        <button class="chip" data-moq="1000" onclick="pickMoq('1000')">1000件</button>
      </div>
    </div>

    <!-- 材質 -->
    <div class="fgroup">
      <div class="fgroup-title">材質</div>
      <div id="matOpts"></div>
    </div>

    <!-- 交期（2026-07-20 改版：與材質/場合等統一改 checkbox 樣式，多選）-->
    <div class="fgroup" id="leadGroup" style="display:none">
      <div class="fgroup-title">交期</div>
      <div id="leadOpts"></div>
    </div>

    <!-- 庫存狀態（2026-07-20 改版：改 checkbox 樣式，多選）-->
    <div class="fgroup" id="stockGroup" style="display:none">
      <div class="fgroup-title">庫存狀態</div>
      <div id="stockOpts"></div>
    </div>

    <!-- 場合 -->
    <div class="fgroup collapsible collapsed">
      <div class="fgroup-title collapsible" onclick="toggleFgroup(this)">
        場合
        <svg class="fgroup-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6L15 12L9 18"/></svg>
      </div>
      <div class="fgroup-body">
        <div id="themeOpts"></div>
      </div>
    </div>

    <!-- 適合產業 -->
    <div class="fgroup collapsible collapsed">
      <div class="fgroup-title collapsible" onclick="toggleFgroup(this)">
        適合產業
        <svg class="fgroup-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6L15 12L9 18"/></svg>
      </div>
      <div class="fgroup-body">
        <div id="indOpts"></div>
      </div>
    </div>

    <!-- 標籤 -->
    <div class="fgroup collapsible collapsed">
      <div class="fgroup-title collapsible" onclick="toggleFgroup(this)">
        標籤
        <svg class="fgroup-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6L15 12L9 18"/></svg>
      </div>
      <div class="fgroup-body">
        <div id="tagOpts"></div>
      </div>
    </div>
  </aside>

  <!-- ── Content ── -->
  <main class="content" id="contentGift">

    <!-- res bar -->
    <div class="res-bar">
      <span class="res-count" id="resCount"></span>
      <div class="active-chips" id="activeChips"></div>
    </div>
    <!-- 客戶單品預算（2026-07-20 改版：第二層篩選，比對基準依 MOQ 動態切換；
         基準說明常駐於橫幅標題，原 res-remark 灰字已併入此處）-->

<script>
// ════════════════════════════════════
// 設定
// ════════════════════════════════════
// 商品資料改由 GAS 讀取中介層（doGet）提供，2026-07-15 起取代 gviz
// Sheet ID 不再出現在前端程式碼中（資料網址見下方 DATA_API_URL）

// 匯出清單設定
// 把下面這行引號裡的字串換成真網址
const EXPORT_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbyIuMD3FcvCjySW8VaNGl6gK-mi-VhG4Myn-AdiMOImslaHp0aUEcOPJuJQ2i0_dyVB/exec';
// 待匯出 Sheet 網址，送出成功後會自動導向這裡
const EXPORT_SHEET_URL  = 'https://docs.google.com/spreadsheets/d/1nzNcaul4ToETE4xADTDJB2TTi495Q3OROvI-Nhb8xUM/edit';

// ════════════════════════════════════
// 存取門檻（A 方案，2026-08-21 新增）
// 密語不再寫死在原始碼裡，改由使用者於進站畫面輸入後存進 localStorage，
// 之後每次呼叫 doGet／doPost 都從這裡讀取、一起帶過去。
// 密語要跟 Apps Script「Script Properties」裡 COZU_TOKEN 的值一致（doGet／doPost 共用同一組）。
// ════════════════════════════════════
const GATE_TOKEN_KEY = 'cozu_gate_token';
function getStoredToken() { return localStorage.getItem(GATE_TOKEN_KEY) || ''; }
// 生成成功畫面「COZU 雲端資料夾」連結（Drive 目標資料夾，2026-07-29 新增）
const COZU_DRIVE_FOLDER_URL = 'https://drive.google.com/drive/folders/17_vnO7KUMFbZEPvwsKNP8LALi3IZHG6p?usp=drive_link';

// 商品資料讀取網址（與匯出接收器同一個 GAS 部署，帶 ?data=products 參數）
// 快取 10 分鐘；業助改完資料想立即確認，可在瀏覽器開此網址並加上 &fresh=1
const DATA_API_URL = EXPORT_WEBAPP_URL + '?data=products';

// 「此訂購量無對應報價」共用文案與圖示（2026-08-19）：卡片與 panel 各自的 CTA 不同，
// 但事實敘述前半段一致，圖示也共用同一顆，兩處只改這裡，不用分別維護
const NO_QUOTE_ICON = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 11H11M14 11H11M11 11V8M11 11V14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M17 17L21 21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M3 11C3 15.4183 6.58172 19 11 19C13.213 19 15.2161 18.1015 16.6644 16.6493C18.1077 15.2022 19 13.2053 19 11C19 6.58172 15.4183 3 11 3C6.58172 3 3 6.58172 3 11Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>';
const NO_QUOTE_TEXT_CARD  = `${NO_QUOTE_ICON}請點選卡片查詢區間價格`;
const NO_QUOTE_TEXT_PANEL = `${NO_QUOTE_ICON}此訂購量無對應報價，請自行查詢下列報價表`;

// 預算篩選（2026-07-20 改版）：七區間，比對基準依 MOQ 動態切換（見 budgetBasis）
const BUDGET_OPTS = [
  { id: 'u100',     label: 'NT$100 以下',  min: 0,    max: 100 },
  { id: '100-200',  label: 'NT$100–200',   min: 101,  max: 200 },
  { id: '200-300',  label: 'NT$200–300',   min: 201,  max: 300 },
  { id: '300-400',  label: 'NT$300–400',   min: 301,  max: 400 },
  { id: '400-500',  label: 'NT$400–500',   min: 401,  max: 500 },
  { id: '500-1000', label: 'NT$500–1000',  min: 501,  max: 1000 },
  { id: 'o1000',    label: 'NT$1000 以上', min: 1001, max: Infinity },
];
// MOQ 篩選（2026-07-20 改版）：精確訂購數量，對應 priceNote 級距；
// 選項來自資料庫實際存在的級距（50/100/200/300/500/1000），勿憑空增減
const MOQ_OPTS = [
  { id: 'all',  label: '不限', qty: null },
  { id: '50',   label: '50',   qty: 50 },
  { id: '100',  label: '100',  qty: 100 },
  { id: '200',  label: '200',  qty: 200 },
  { id: '300',  label: '300',  qty: 300 },
  { id: '500',  label: '500',  qty: 500 },
  { id: '1000', label: '1000', qty: 1000 },
];
// 2026-08-20 新增：MOQ chips 能篩到的最大訂購量。商品自己的 moq 若超過這個值，
// 代表選任何一個具體訂購量都會被 matchMoq() 排除、只有「不限」看得到，容易讓業務誤以為
// 篩選壞了；卡片加「大量訂購」標記提示原因。用相對值（取 MOQ_OPTS 最大者）而非寫死數字，
// 以後 MOQ_OPTS 增減選項時這裡自動跟著調整，不用兩邊維護
const MAX_MOQ_FILTER_QTY = Math.max(...MOQ_OPTS.filter(m => m.qty != null).map(m => m.qty));

// ════════════════════════════════════
// 狀態
// ════════════════════════════════════
let products = [];
let selMats    = new Set();
let selThemes  = new Set();
let selInds    = new Set();
let selTags    = new Set();
let selBudgets = new Set(); // 多選
let selLeads   = new Set(); // 交期（多選）
let selStocks  = new Set(); // 庫存狀態（多選）
let selMoq     = 'all';
let sortOrder  = 'asc'; // 2026-08-26 新增：卡片價格排序方向，'asc' | 'desc'
let selectedIds = new Set(); // 已勾選商品的 _id
let customerName = ''; // 提案客戶名稱
// 2026-08-19：預算橫幅展開狀態，跟 selMoq 脫鉤——預設收合，選具體 MOQ 時 pickMoq() 會
// 連動設為展開、切回不限連動設為收合，但使用者可隨時用標題列箭頭手動覆寫
let budgetBannerOpen = false;

// ════════════════════════════════════
// 載入資料（2026-07-15 起改讀 GAS 中介層，gviz 與 parseGviz/parseGvizDate 退役）
// ════════════════════════════════════
async function loadData() {
  const url = DATA_API_URL + '&token=' + encodeURIComponent(getStoredToken());
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  // GAS ContentService 經轉址後 Content-Type 不一定是 JSON，用 text 再 parse 最穩
  const data = JSON.parse(await res.text());
  if (!data.success) throw new Error(data.message || '中介層回報讀取失敗');
  return parseProducts(data.products || []);
}

// 把中介層回傳的商品 JSON 整理成前端使用的物件格式
// （欄位皆為字串、空欄為 ''、日期已是 YYYY-MM-DD，不需再做 gviz 式的型別防禦）
function parseProducts(items) {
  return items.map((item, idx) => {
    const get = k => String(item[k] ?? '').trim();

    // 預算篩選用數值：price_max 取範圍起始值（"85-95" → 85）
    const priceRaw = get('price');
    const priceMax = parseFloat(get('price_max')) || parseFloat(priceRaw) || 0;
    const priceMin = parseFloat(get('price_min')) || priceMax;

    return {
      _id               : idx,
      name              : get('name'),
      price             : priceRaw,   // 保留原始字串供顯示用
      price_max         : priceMax,
      price_min         : priceMin,
      priceNote         : get('priceNote'),
      priceRemark       : get('priceRemark'),
      moq               : parseInt(get('moq')) || 0,
      material_category : get('material_category'),
      material          : get('material'),
      tag               : get('tag'),
      industries        : get('industries').split(',').map(s => s.trim()).filter(Boolean),
      themes            : [], // 資料庫無此欄位；保留空陣列讓主題篩選程式正常運作
      image_url         : get('image_url'),
      slide_id          : get('slide_id'),
      lead_time         : get('lead_time'),
      in_stock          : get('in_stock'),
      sample_location   : get('sample_location'),
      last_updated_time : get('last_updated_time'), // 中介層已輸出 YYYY-MM-DD
    };
  }).filter(p => p.name);
}

function getMats(p) {
  return p.material_category ? [p.material_category] : [];
}

// ════════════════════════════════════
// priceNote 解析工具
// ════════════════════════════════════
// priceNote 格式：「200:170-180|300:155-165|500:120-130|1000:100-110」
// 回傳陣列 [{qty, price}, ...]，已排序由小到大
function parsePriceNote(raw) {
  if (!raw || !raw.includes(':')) return [];
  return raw.split('|').map(seg => {
    const [qty, price] = seg.split(':');
    const q = parseInt((qty || '').trim());
    const p = (price || '').trim();
    return (isNaN(q) || !p) ? null : { qty: q, price: p };
  }).filter(Boolean).sort((a, b) => a.qty - b.qty);
}

// 取 priceNote 最後一筆（最大量、最低價）供卡片小字顯示
function getLastPriceTier(raw) {
  const tiers = parsePriceNote(raw);
  return tiers.length ? tiers[tiers.length - 1] : null;
}

// 將 price 字串格式化為顯示用：「65-75」→「65–75」；「65」→「65」
function formatPrice(priceStr) {
  if (!priceStr) return '';
  const s = String(priceStr).trim();
  // 範圍值：數字-數字
  if (/^\d+(\.\d+)?-\d+(\.\d+)?$/.test(s)) {
    const [lo, hi] = s.split('-');
    return `${lo}–${hi}`;
  }
  return s;
}

// 從價格字串取最低值：「60-65」→ 60；「65」→ 65
function lowestPrice(priceStr) {
  if (!priceStr) return null;
  const parts = String(priceStr).split('-').map(s => parseFloat(s.trim())).filter(n => !isNaN(n));
  return parts.length ? Math.min(...parts) : null;
}

// ════════════════════════════════════
// 篩選邏輯（2026-07-20 改版：雙層價格篩選）
// ════════════════════════════════════
// 取商品在目前選定 MOQ 級距的報價字串（2026-08-19 改為累進階梯：
// 抓「小於等於選定數量」的最大階，例如選 200 件、商品只填 100/500/1000 三階 →
// 抓 100 那階；tiers 已依 qty 由小到大排序，過濾後取最後一筆即為最大符合階）
// 未選 MOQ，或所有已知階都比選定數量高（沒有更低階可用）→ 回傳 null
function getTierPrice(p) {
  if (selMoq === 'all') return null;
  const qty = MOQ_OPTS.find(m => m.id === selMoq).qty;
  const tiers = parsePriceNote(p.priceNote).filter(t => t.qty <= qty);
  const tier = tiers.length ? tiers[tiers.length - 1] : null;
  return tier ? tier.price : null;
}

// 預算比對基準（雙基準規則，2026-07-20 定案）：
// 未選 MOQ → 用 price 欄（500 份基準；spec 規定無 500 份資料時該欄為最小 MOQ 報價）
// 已選 MOQ → 用累進階梯抓到的級距報價；沒有更低階可用 → 回傳 null
// 範圍值（如 65-75）取最低值比對，與排序基準一致
function budgetBasis(p) {
  if (selMoq === 'all') {
    const v = lowestPrice(p.price);
    return v != null ? v : (p.price_max || null);
  }
  const tp = getTierPrice(p);
  return tp ? lowestPrice(tp) : null;
}

// 檢查商品所有已知報價階（不限選定的 MOQ），是否有任一階的價格真的落在使用者選的
// 預算區間內。2026-08-19 新增：專門處理「已選 MOQ，但商品所有已知階都比選定數量高，
// 沒有更低階可用」這種情況——這種商品訂購量拉高後可能真的會到那個價位，值得讓業務
// 自己判斷、去跟客戶推「訂多一點就到你要的價格」，但要有真實報價數字撐著才放行，
// 不是無條件放行（無條件放行會重蹈今天稍早才修掉的「無差別塞進不合理區間」問題）
function hasAnyTierInBudget(p) {
  const tiers = parsePriceNote(p.priceNote);
  return tiers.some(t => {
    const v = lowestPrice(t.price);
    if (v == null) return false;
    return [...selBudgets].some(id => {
      const opt = BUDGET_OPTS.find(b => b.id === id);
      if (!opt) return false;
      return v >= opt.min && v <= opt.max;
    });
  });
}

function matchBudget(p) {
  if (selBudgets.size === 0) return true;
  const basis = budgetBasis(p);
  // 2026-08-19 修正（第二版）：basis 為 null 現在只會在「已選 MOQ，但商品所有已知階都
  // 比選定數量高」時出現（getTierPrice 已改累進階梯，抓不到代表真的沒有更低階）。
  // 不再一律排除，改成檢查該商品其他已知階有沒有落在選定預算區間的（hasAnyTierInBudget）；
  // 完全沒有任何一階對得上，才真的排除——維持「要有報價證據才放行」的原則，
  // 只是把證據範圍從「只看選定的那個 MOQ 階」放寬成「看這商品所有已知階」。
  // 卡片上「此訂購量無對應報價」是獨立的顯示規則，給業務瀏覽用，不受此排除影響。
  if (basis == null) return hasAnyTierInBudget(p);
  return [...selBudgets].some(id => {
    const opt = BUDGET_OPTS.find(b => b.id === id);
    if (!opt) return false;
    return basis >= opt.min && basis <= opt.max;
  });
}

// MOQ 篩選：業務指定訂購數量，排除起訂量（moq 欄）高於該數量的商品
function matchMoq(moq) {
  const opt = MOQ_OPTS.find(m => m.id === selMoq);
  if (!opt || opt.qty == null) return true;
  return moq <= opt.qty;
}

// 排序基準：未選 MOQ → price（500 份基準）最低值；已選 MOQ → 累進階梯抓到的級距報價最低值
// 沒有更低階可用或無價格 → 回傳 null（不可再用 Infinity：2026-08-26 加入「高到低」排序後，
// Infinity 在 desc 排序會被排到最前面，語意上無報價商品應恆沉底，跟排序方向無關，
// 沉底邏輯改交給 compareByPrice 統一處理，見下方）
function priceSortKey(p) {
  if (selMoq !== 'all') {
    const tp = getTierPrice(p);
    return tp ? lowestPrice(tp) : null;
  }
  const v = lowestPrice(p.price);
  if (v != null) return v;
  return (p.price_max != null ? p.price_max : null);
}
// 2026-08-26 新增：無報價商品（priceSortKey 回傳 null）無論 asc/desc 一律沉底，
// 兩者都無報價則視為相等（維持原順序，Array.sort 為穩定排序）
function compareByPrice(a, b) {
  const ka = priceSortKey(a);
  const kb = priceSortKey(b);
  const aNull = (ka == null);
  const bNull = (kb == null);
  if (aNull && bNull) return 0;
  if (aNull) return 1;
  if (bNull) return -1;
  return sortOrder === 'asc' ? (ka - kb) : (kb - ka);
}

function getFiltered() {
  return products.filter(p => {
    if (selMats.size   && !getMats(p).some(m => selMats.has(m)))             return false;
    if (selThemes.size && !p.themes.some(t => selThemes.has(t)))            return false;
    if (selInds.size   && !p.industries.some(i => selInds.has(i)))          return false;
    if (selTags.size   && !selTags.has(p.tag))                              return false;
    if (selLeads.size  && !selLeads.has(p.lead_time))                       return false;
    if (selStocks.size && !selStocks.has(p.in_stock))                       return false;
    if (!matchBudget(p))                                                    return false;
    if (!matchMoq(p.moq))                                                   return false;
    return true;
  }).sort(compareByPrice); // 預設：價格低 → 高；sortOrder 可切換高 → 低
}

// ════════════════════════════════════
// 動態計算 counts（只算目前篩選下的）
// ════════════════════════════════════
function computeCounts() {
  const c = { mat: {}, theme: {}, ind: {}, tag: {}, lead: {}, stock: {} };
  products.forEach(p => {
    getMats(p).forEach(m => c.mat[m] = (c.mat[m] || 0) + 1);
    p.themes.forEach(t => c.theme[t] = (c.theme[t] || 0) + 1);
    p.industries.forEach(i => c.ind[i] = (c.ind[i] || 0) + 1);
    if (p.tag) c.tag[p.tag] = (c.tag[p.tag] || 0) + 1;
    if (p.lead_time) c.lead[p.lead_time] = (c.lead[p.lead_time] || 0) + 1;
    if (p.in_stock)  c.stock[p.in_stock] = (c.stock[p.in_stock] || 0) + 1;
  });
  return c;
}

// 建立 rail 選項
// ════════════════════════════════════
// 從 products 動態取得所有不重複的 material_category
function getDynamicMats() {
  const seen = new Set();
  const result = [];
  products.forEach(p => {
    if (p.material_category && !seen.has(p.material_category)) {
      seen.add(p.material_category);
      result.push(p.material_category);
    }
  });
  return result.sort();
}

const ALL_THEMES = ['週年慶','員工福利','節慶送禮','尾牙','新品上市','開幕活動'];
const ALL_INDS  = ['科技','金融','醫療','零售','餐飲','政府機關','其他'];
const ALL_TAGS  = ['熱銷','實用','科技感','環保'];

function buildCheckGroup(containerId, options, selSet, counts, onToggle) {
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  options.forEach(opt => {
    const on  = selSet.has(opt);
    const cnt = counts[opt] || 0;
    const div = document.createElement('div');
    div.className = 'opt' + (on ? ' on' : '');
    div.innerHTML = `<span class="box"></span><span>${opt}</span><span class="opt-cnt">${cnt}</span>`;
    div.addEventListener('click', () => onToggle(opt));
    el.appendChild(div);
  });
}

// 交期／庫存的顯示順序偏好：資料庫出現的值照這個順序排，
// 不在清單裡的值排在後面（照字典序），確保新增選項也不會被藏起來
const LEAD_ORDER  = ['10天', '30天', '45天', '60天', '90天'];
const STOCK_ORDER = ['有現貨', '需洽詢', '需訂製'];

// 從 products 動態取得某欄位所有不重複的值，依偏好順序排列
function getDynamicVals(field, order) {
  const seen = new Set();
  products.forEach(p => { if (p[field]) seen.add(p[field]); });
  const inOrder = order.filter(v => seen.has(v));
  const rest    = [...seen].filter(v => !order.includes(v)).sort();
  return [...inOrder, ...rest];
}

function buildRail() {
  const counts  = computeCounts();
  const allMats = getDynamicMats();
  buildCheckGroup('matOpts',   allMats,    selMats,   counts.mat,   v => toggle(selMats, v, render));
  buildCheckGroup('themeOpts', ALL_THEMES, selThemes, counts.theme, v => toggle(selThemes, v, render));
  buildCheckGroup('indOpts',   ALL_INDS,   selInds,   counts.ind,   v => toggle(selInds, v, render));
  buildCheckGroup('tagOpts',   ALL_TAGS,   selTags,   counts.tag,   v => toggle(selTags, v, render));

  // 交期／庫存：選項來自資料庫實際填寫的值；資料庫該欄全空時整組隱藏
  const leadVals  = getDynamicVals('lead_time', LEAD_ORDER);
  const stockVals = getDynamicVals('in_stock',  STOCK_ORDER);
  document.getElementById('leadGroup').style.display  = leadVals.length  ? '' : 'none';
  document.getElementById('stockGroup').style.display = stockVals.length ? '' : 'none';
  buildCheckGroup('leadOpts',  leadVals,  selLeads,  counts.lead,  v => toggle(selLeads,  v, render));
  buildCheckGroup('stockOpts', stockVals, selStocks, counts.stock, v => toggle(selStocks, v, render));
}

function toggle(set, val, cb) {
  set.has(val) ? set.delete(val) : set.add(val);
  cb();
}

// ════════════════════════════════════
// Chip filters
// ════════════════════════════════════
function toggleBudget(id) {
  if (selBudgets.has(id)) {
    selBudgets.delete(id);
  } else {
    selBudgets.add(id);
  }
  updateBudgetChips();
  render();
}
function updateBudgetChips() {
  document.querySelectorAll('#budgetChips .chip').forEach(b => {
    b.classList.toggle('on', selBudgets.has(b.dataset.budget));
  });
}
function pickMoq(id) {
  selMoq = id;
  // 2026-08-19：MOQ 切回「不限」時清空已選的預算篩選，不保留隱性篩選狀態
  // （不限時 budgetBasis 改用 500 份基準，先前選的區間可能已不對應真實情境）
  if (id === 'all') {
    selBudgets.clear();
    updateBudgetChips();
  }
  // 2026-08-19：選具體訂購數量時連動自動展開預算橫幅、切回不限連動自動收合；
  // 使用者仍可用標題列箭頭（toggleBudgetBanner）隨時手動覆寫，兩者是疊加關係
  budgetBannerOpen = (id !== 'all');
  document.querySelectorAll('#moqChips .chip').forEach(b => {
    b.classList.toggle('on', b.dataset.moq === id);
  });
  render();
}
// 2026-08-26 新增：卡片排序方向切換（兩顆常駐 icon，選中的那顆是目前排序方向）
function setSortOrder(order) {
  if (order === sortOrder) return; // 已經是目前狀態，不重複 render
  sortOrder = order;
  document.getElementById('sortAscBtn').classList.toggle('active', order === 'asc');
  document.getElementById('sortDescBtn').classList.toggle('active', order === 'desc');
  render();
}
// 2026-08-19：預算橫幅標題列的手動展開/收合（拿掉原本切換 MOQ 時的整塊背景閃動，
// 改用箭頭 + 內容淡入淡出，比較不突兀）
function toggleBudgetBanner() {
  budgetBannerOpen = !budgetBannerOpen;
  document.getElementById('budgetBanner').classList.toggle('collapsed', !budgetBannerOpen);
}
// 基準說明文字的 fade 切換：先比對內容是否真的變了，沒變就不觸發，
// 變了才淡出→換字→淡入，時間要對應 CSS 的 .budget-basis transition（150ms）
function updateBudgetBasisText() {
  const el = document.getElementById('budgetBasis');
  const next = selMoq !== 'all'
    ? `以 ${MOQ_OPTS.find(m => m.id === selMoq).qty} 件報價為基準`
    : '以 500 件報價為基準（無 500 件資料時取最小 MOQ 報價）';
  if (el.textContent === next) return;
  el.classList.add('fading');
  setTimeout(() => {
    el.textContent = next;
    el.classList.remove('fading');
  }, 150);
}

// ════════════════════════════════════
// Render
// ════════════════════════════════════
function render() {
  buildRail();
  const filtered = getFiltered();
  const hasFilter = selMats.size || selThemes.size || selInds.size || selTags.size || selBudgets.size || selLeads.size || selStocks.size || selMoq !== 'all';

  document.getElementById('clearBtn').disabled = !hasFilter;
  document.getElementById('resCount').innerHTML = `找到 <b>${filtered.length}</b> 項商品`;

  // 收合狀態（2026-08-19）：改由 budgetBannerOpen 控制，不再直接綁 selMoq === 'all'。
  // pickMoq() 會連動設定 budgetBannerOpen（見上方），這裡只負責把狀態同步到 DOM，
  // 跟 toggleBudgetBanner() 共用同一份「唯一畫面來源」，clearAll() 也會經過這裡
  document.getElementById('budgetBanner').classList.toggle('collapsed', !budgetBannerOpen);

  // 基準說明（2026-07-20 修訂）：常駐於預算橫幅標題，隨 MOQ 動態切換；
  // 未選 MOQ 時附註 500 份缺資料的遞補規則（原 res-remark 內容併入此處）；
  // 2026-08-19：文字改用 fade 切換取代原本切 MOQ 時的整塊背景閃動，只有內容真的變了才
  // 觸發淡入淡出，避免其他篩選互動（跟 budgetBasis 無關）也跟著閃一下
  updateBudgetBasisText();

  // active chips
  const achip = document.getElementById('activeChips');
  achip.innerHTML = '';
  const addChip = (label, rm) => {
    const s = document.createElement('span');
    s.className = 'achip';
    s.innerHTML = `${label}<button>×</button>`;
    s.querySelector('button').addEventListener('click', rm);
    achip.appendChild(s);
  };
  selMats.forEach(m  => addChip('材質：' + m,  () => toggle(selMats,   m, render)));
  selThemes.forEach(t => addChip('場合：' + t, () => toggle(selThemes, t, render)));
  selInds.forEach(i  => addChip('產業：' + i,  () => toggle(selInds,   i, render)));
  selTags.forEach(t  => addChip('風格：' + t,  () => toggle(selTags,   t, render)));
  selLeads.forEach(l  => addChip('交期：' + l, () => toggle(selLeads,  l, render)));
  selStocks.forEach(s => addChip('庫存：' + s, () => toggle(selStocks, s, render)));
  selBudgets.forEach(id => {
    const opt = BUDGET_OPTS.find(b => b.id === id);
    if (opt) addChip('預算：' + opt.label, () => { selBudgets.delete(id); updateBudgetChips(); render(); });
  });
  if (selMoq    !== 'all') addChip('MOQ ' + MOQ_OPTS.find(m => m.id === selMoq).label, () => pickMoq('all'));

  // cards
  const grid  = document.getElementById('cardGrid');
  const empty = document.getElementById('stateEmpty');

  if (filtered.length === 0) {
    grid.style.display  = 'none';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  grid.style.display  = 'grid';
  grid.innerHTML = '';

  filtered.forEach(p => {
    const mats  = getMats(p);
    const card  = document.createElement('button');
    card.className = 'card' + (selectedIds.has(p._id) ? ' selected' : '');
    card.dataset.id = p._id;
    card.addEventListener('click', () => openPeek(p));

    const imgHtml = p.image_url
      ? `<img src="${p.image_url}" alt="${p.name}" />`
      : `<img src="https://img.shoplineapp.com/media/image_clips/6a85211ab42441111e52f307/original.png?1787109658=&owner_id=58c5132a59d524173800069b" alt="尚未上傳圖片" />`;


    card.innerHTML = `
      <div class="card-img">
        <div class="card-checkbox${selectedIds.has(p._id) ? ' on' : ''}" onclick="toggleSelect(${p._id}, event)"></div>
        ${imgHtml}
      </div>
      <div class="card-body">
        <div class="card-name-row">
          <span class="card-name">${p.name}</span>
          <span class="card-name-mats">${(mats.length ? mats : []).slice(0,2).map(m => `<span class="mtag mtag-mat">${m}</span>`).join('')}</span>
        </div>
        <div class="card-price">
          <div class="card-price-row">
            ${(() => {
              // 2026-07-20 改版：已選 MOQ → 顯示對應級距價、隱藏灰字「起」價；
              // 無對應級距 → 顯示標註（B 方案）。未選 MOQ → 維持原雙價格顯示
              if (selMoq !== 'all') {
                const tp = getTierPrice(p);
                return tp
                  ? `<span class="card-price-main">NT$${formatPrice(tp)}</span>`
                  : `<span class="card-price-noquote">${NO_QUOTE_TEXT_CARD}</span>`;
              }
              return `<span class="card-price-main">NT$${formatPrice(p.price) || p.price_max}</span>
            ${p.price_min && p.price_min < p.price_max ? `<span class="card-price-min">NT$${p.price_min}起</span>` : ''}`;
            })()}
          </div>
        </div>
        <div class="card-meta">
          <span>MOQ ${p.moq.toLocaleString()}</span>
          ${p.moq > MAX_MOQ_FILTER_QTY ? `<span class="moq-bulk-badge">・大量訂購</span>` : ''}
        </div>
        <div class="card-tag-row">
          ${p.themes.slice(0,2).map(t => `<span class="mtag">${t}</span>`).join('')}
          ${p.tag ? `<span class="mtag">${p.tag}</span>` : ''}
        </div>
      </div>`;
    grid.appendChild(card);
  });
}

// ════════════════════════════════════
// 商品選取（Checkbox + 底部工具列）
// ════════════════════════════════════
function toggleSelect(id, evt) {
  evt.stopPropagation(); // 避免觸發卡片本身的 openPeek

  if (selectedIds.has(id)) selectedIds.delete(id);
  else selectedIds.add(id);

  const card = document.querySelector(`.card[data-id="${id}"]`);
  if (card) {
    const on = selectedIds.has(id);
    card.classList.toggle('selected', on);
    card.querySelector('.card-checkbox')?.classList.toggle('on', on);
  }
  updateBottomBar();
}

function clearSelected() {
  selectedIds.clear();
  document.querySelectorAll('.card.selected').forEach(c => {
    c.classList.remove('selected');
    c.querySelector('.card-checkbox')?.classList.remove('on');
  });
  updateBottomBar();
}

function updateBottomBar() {
  const bar = document.getElementById('bottomBar');
  const count = selectedIds.size;
  document.getElementById('bottomBarCount').textContent = `已選 ${count} 件禮贈品`;
  bar.classList.toggle('show', count > 0);
  document.body.classList.toggle('has-bottom-bar', count > 0);

  // 匯出按鈕：客戶名稱有填 且 已勾選至少 1 件商品，才解鎖
  const exportBtn = document.getElementById('exportBtn');
  exportBtn.disabled = !(count > 0 && customerName.length > 0);
}

function onCustomerNameInput() {
  customerName = document.getElementById('customerNameInput').value.trim();
  updateBottomBar();
}

function writePopup_(popup, bodyHtml) {
  if (!popup) return;
  popup.document.write(popupShell_(bodyHtml));
  popup.document.close();
}

function renderPopupLoading_(popup, customer, count) {
  writePopup_(popup, `
    <div class="loading-wrap">
      <div class="spinner"></div>
      <h1 id="loadingTitle" class="loading-title">正在確認商品清單...</h1>
      <p class="loading-desc">過程中請勿關閉此分頁，通常需要 20–40 秒生成</p>
      <div class="info-card">
        <div class="info-card-icon">${LOADING_ICON_SVG_}</div>
        <div class="info-card-text">
          <span>提案客戶：${customer}</span>
          <span>商品件數：${count} 件</span>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var phrases = [
          '正在確認商品清單...',
          '正在比對簡報頁面...',
          '正在整理提案簡報...',
          '即將完成，請稍候...'
        ];
        var idx = 0;
        var timer = setInterval(function () {
          idx = (idx + 1) % phrases.length;
          var el = document.getElementById('loadingTitle');
          if (el) {
            el.textContent = phrases[idx];
          } else {
            // 防禦性清除：理論上分頁內容被 writePopup_ 整個重寫時，
            // 這個計時器所在的 script 環境會隨舊文件一起被拋棄而自動停止，
            // 這裡额外清除只是保險，避免任何瀏覽器實作差異造成殘留。
            clearInterval(timer);
          }
        }, 4500);
      })();
    <\/script>
  `);
}

// 狀態二：生成成功（資料已寫入、簡報已產出）
// 2026-07-29 改版：客戶名稱併入標題、拿掉件數 meta 行，
// 新增「COZU 雲端資料夾」連結（只有這六個字加底線）。
// notFound 警語位置：暫沿用舊版「按鈕群組下方」，Can 之後會補圖決定最終位置，
// 屆時只需調整 .success-warn 在下方 HTML 裡的位置即可，不影響其他邏輯。
function renderPopupSuccess_(popup, url, notFound, customer, count) {
  const warnHtml = (notFound && notFound.length > 0)
    ? `<p class="success-warn">⚠️ 部分商品找不到對應頁面：${notFound.join('、')}</p>`
    : '';
  writePopup_(popup, `
    <div class="success-wrap">
      <div class="success-icon">${SUCCESS_ICON_SVG_}</div>
      <h1 class="success-title">${customer}提案簡報已完成</h1>
      <p class="success-desc">簡報已存放於 <a href="${COZU_DRIVE_FOLDER_URL}" target="_blank" rel="noopener noreferrer">COZU 雲端資料夾</a>中</p>
      <div class="success-actions">
        <a class="success-btn-primary" href="${url}" target="_blank" rel="noopener noreferrer">開啟簡報</a>
        <button class="success-btn-secondary" onclick="
          navigator.clipboard.writeText('${url}').then(() => {
            this.textContent = '已複製連結';
            setTimeout(() => { this.textContent = '複製連結'; }, 1600);
          });
        ">複製連結</button>
      </div>
      ${warnHtml}
    </div>
  `);
}

// 狀態三：資料已寫入待匯出 Tab，但生成端逾時／失敗（可去待匯出 Sheet 手動救援）
// 2026-07-29 改版：標題／說明文字改用 loading-title / loading-desc（比照狀態四連線異常），
// 按鈕仍沿用 .link-btn（實心按鈕），沒有改動
function renderPopupGenerationFailed_(popup, sheetUrl) {
  writePopup_(popup, `
    <div class="loading-wrap">
      <h1 class="loading-title">連線逾時</h1>
      <p class="loading-desc">商品清單已成功寫入，但自動生成簡報逾時或發生錯誤，請改由手動重新匯出。</p>
      <a class="link-btn" href="${sheetUrl}" target="_blank" rel="noopener noreferrer">開啟待匯出 Sheet</a>
    </div>
  `);
}

// 狀態四：送出本身就失敗（密語或格式錯誤，資料尚未寫入，不給 Sheet 連結）
// 2026-07-29 改版：文字排版比照 loading 畫面（loading-title / loading-desc），間距一致
function renderPopupSubmitFailed_(popup, message) {
  writePopup_(popup, `
    <div class="loading-wrap">
      <h1 class="loading-title">送出失敗</h1>
      <p class="loading-desc">${message}</p>
      <p class="state-hint">請關閉此分頁，回到主畫面重新按一次匯出</p>
    </div>
  `);
}

// 狀態五：連線本身出錯（fetch 失敗，無法確認資料是否寫入）
// 2026-07-29 改版：文字排版比照 loading 畫面（loading-title / loading-desc），間距一致；
// 連結顏色改為 #1D1D1F（見上方 .sheet-link）
function renderPopupNetworkError_(popup, sheetUrl) {
  writePopup_(popup, `
    <div class="loading-wrap">
      <h1 class="loading-title">連線異常</h1>
      <p class="loading-desc">網路連線出現問題，請確認網路狀態無異常後，回到系統頁面重新匯出</p>
      <p class="state-hint">或直接前往待匯出 Sheet 確認商品匯出狀態：</p>
      <a class="sheet-link" href="${sheetUrl}" target="_blank" rel="noopener noreferrer">開啟待匯出 Sheet</a>
    </div>
  `);
}

async function handleExport() {
  if (selectedIds.size === 0 || !customerName) return;

  // 一定要在這裡（使用者點擊的當下、await 之前）同步呼叫 window.open，
  // 不然瀏覽器的彈出視窗攔截器會擋掉之後才開的分頁
  const popup = window.open('', '_blank');

  const count = selectedIds.size;
  const customer = customerName;

  renderPopupLoading_(popup, customer, count);

  const items = products
    .filter(p => selectedIds.has(p._id))
    .map(p => ({ name: p.name, slideId: p.slide_id || '' }));

  const payload = {
    token: getStoredToken(),
    customer: customerName,
    items,
  };

  try {
    const res = await fetch(EXPORT_WEBAPP_URL, {
      method: 'POST',
      // Content-Type 用 text/plain 是刻意的：避免瀏覽器對 GAS doPost 發出 CORS 預檢請求（GAS 不支援），這是業界慣用寫法
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
    });
    const result = await res.json();

    if (!result.success) {
      // 送出本身失敗（密語錯、格式錯），資料尚未寫入
      renderPopupSubmitFailed_(popup, result.message || '請確認資料庫格式是否有誤');
      return;
    }

    if (result.generation && result.generation.status === 'success') {
      renderPopupSuccess_(popup, result.generation.url, result.generation.notFound, customer, count);
    } else {
      // 資料已寫入，但生成失敗或逾時
      const sheetUrl = result.exportSheetUrl || EXPORT_SHEET_URL;
      renderPopupGenerationFailed_(popup, sheetUrl);
    }
  } catch (err) {
    renderPopupNetworkError_(popup, EXPORT_SHEET_URL);
  }
}

          `<div class="price-tier-row${t.qty === selQty ? ' price-tier-row-active' : ''}"><span class="price-tier-qty">${t.qty.toLocaleString()}份</span><span class="price-tier-price">NT$${t.price}</span></div>`
        ).join('');
        return `<div class="price-tier-table">${rows}<a class="price-tier-more" href="${QUOTATION_URL}" target="_blank" rel="noopener noreferrer"><div class="price-tier-more-inner"><span>1000份以上量大另議</span><span>→</span></div></a></div>`;
      })()}
      ${(() => {
        const remark = (p.priceRemark || '').replace(/・?量大另議/g, '').replace(/量大另議・?/g, '').trim();
        if (!remark) return '';
        const icon = `<svg width="14" height="14" stroke-width="1.5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0;vertical-align:middle;margin-right:4px;color:inherit"><path d="M8 14L16 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M8 10L10 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M8 18L12 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M10 3H6C4.89543 3 4 3.89543 4 5V20C4 21.1046 4.89543 22 6 22H18C19.1046 22 20 21.1046 20 20V5C20 3.89543 19.1046 3 18 3H14.5M10 3V1M10 3V5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>`;
        return `<div class="peek-price-remark"><span style="display:inline-flex;align-items:center;gap:4px;font-weight:500;margin-bottom:2px">${icon}業務備註</span><br>${remark}</div>`;
      })()}
    </div>

    <div class="dl">
      <div class="dl-title">規格</div>
      <div class="dl-row"><span class="dl-key">材質</span><span class="dl-val">${p.material}</span></div>
      <div class="dl-row"><span class="dl-key">最低訂購量</span><span class="dl-val">${p.moq.toLocaleString()} 件</span></div>
      <div class="dl-row"><span class="dl-key">交期</span><span class="dl-val">${p.lead_time || '—'}</span></div>
      <div class="dl-row"><span class="dl-key">庫存狀態</span><span class="dl-val">${p.in_stock || '—'}</span></div>
      <div class="dl-row"><span class="dl-key">樣品位置</span><span class="dl-val">${p.sample_location || '—'}</span></div>
      <div class="dl-row"><span class="dl-key">自訂標籤</span><span class="dl-val">${p.tag}</span></div>
      ${p.last_updated_time ? `<div class="dl-row"><span class="dl-key">最後更新時間</span><span class="dl-val">${p.last_updated_time}</span></div>` : ''}
    </div>

    <div class="dl">
      <div class="dl-title">適合場合</div>
      <div class="pills">${p.themes.map(t => `<span class="pill">${t}</span>`).join('')}</div>
    </div>

    <div class="dl">
      <div class="dl-title">適合產業</div>
      <div class="pills">${p.industries.map(i => `<span class="pill">${i}</span>`).join('')}</div>
    </div>

`;

  document.getElementById('scrim').style.display = 'block';
  document.getElementById('peek').style.display  = 'flex';
  document.body.style.overflow = 'hidden';
}

function closePeek() {
  document.getElementById('scrim').style.display = 'none';
  document.getElementById('peek').style.display  = 'none';
  document.body.style.overflow = '';
}

// ════════════════════════════════════
// Tab switch (stub)
// ════════════════════════════════════
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`[data-tab="${tab}"]`)?.classList.add('active');
}

// ════════════════════════════════════
// Sticky 對齊（2026-07-20）：rail／預算橫幅的吸頂位置改為實測 topbar 高度，
// 取代原本寫死的 106px（誤差在透明背景的 rail 上看不出來，
// 但在有底色的 banner 上會露出空隙，故改為動態量測避免誤差）
// ════════════════════════════════════
(() => {
  const topbar = document.querySelector('.topbar');
  const rail   = document.getElementById('railGift');
  const banner = document.getElementById('budgetBanner');
  if (!topbar) return;

  function syncStickyTop() {
    const h = topbar.offsetHeight + 'px';
    if (rail)   rail.style.top   = h;
    if (banner) banner.style.top = h;
  }
  syncStickyTop();
  window.addEventListener('resize', syncStickyTop);

  // 預算橫幅吸頂偵測：吸住時加 .stuck 縮薄（試做版，效果不佳可整段刪除，橫幅仍會正常 sticky）
  if (banner) {
    let ticking = false;
    window.addEventListener('scroll', () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        banner.classList.toggle('stuck', banner.getBoundingClientRect().top <= topbar.offsetHeight + 1);
        ticking = false;
      });
    }, { passive: true });
  }
})();

// ════════════════════════════════════
// Access Gate（密語輸入門檻，A 方案，2026-08-21 新增）
// ════════════════════════════════════

// 密語驗證通過、資料讀取成功後才會呼叫這個函式，把畫面切到正常內容
function finishInit() {
  // 右上角：取所有商品中最新的 last_updated_time，若無則顯示載入時間
  const latestUpdate = products
    .map(p => p.last_updated_time)
    .filter(Boolean)
    .sort()
    .pop();
  document.getElementById('lastUpdated').textContent =
    latestUpdate ? `最後更新 ${latestUpdate}` : (() => {
      const now = new Date();
      return `載入於 ${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    })();
  document.getElementById('stateLoading').style.display = 'none';
  document.getElementById('cardGrid').style.display     = 'grid';
  buildRail();
  render();
}

// 顯示輸入表單（密語錯誤、或本來就沒有存密語時呼叫）
function showGateForm(errorText) {
  document.getElementById('gateChecking').style.display = 'none';
  document.getElementById('gateForm').style.display = 'block';
  const errorEl = document.getElementById('gateError');
  if (errorText) {
    errorEl.textContent = errorText;
    errorEl.style.display = 'block';
  } else {
    errorEl.style.display = 'none';
  }
  const btn = document.getElementById('gateSubmit');
  btn.disabled = false;
  btn.textContent = '登入';
  const input = document.getElementById('gateInput');
  input.value = '';
  input.type = 'password';
  document.getElementById('gateToggle').innerHTML = GATE_EYE_CLOSED_ICON;
  document.getElementById('gateToggle').setAttribute('aria-label', '顯示密碼');
  input.focus();
}

function hideGate() {
  document.getElementById('gateOverlay').style.display = 'none';
}

// 密碼顯示／隱藏切換（眼睛 icon，2026-08-21 新增）
const GATE_EYE_CLOSED_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M19.5 16L17.0248 12.6038" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M12 17.5V14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M4.5 16L6.96895 12.6124" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M3 8C6.6 16 17.4 16 21 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>';
const GATE_EYE_OPEN_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 13C6.6 5 17.4 5 21 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M12 17C10.3431 17 9 15.6569 9 14C9 12.3431 10.3431 11 12 11C13.6569 11 15 12.3431 15 14C15 15.6569 13.6569 17 12 17Z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>';

function toggleGatePassword() {
  const input = document.getElementById('gateInput');
  const btn = document.getElementById('gateToggle');
  const willShow = input.type === 'password';
  input.type = willShow ? 'text' : 'password';
  btn.innerHTML = willShow ? GATE_EYE_OPEN_ICON : GATE_EYE_CLOSED_ICON;
  btn.setAttribute('aria-label', willShow ? '隱藏密碼' : '顯示密碼');
  input.focus();
}

// 帶著目前存在 localStorage 的密語去讀一次商品資料；
// 成功＝密語正確且資料載入完成，失敗則依錯誤內容分流處理
async function tryLoadAndEnter() {
  try {
    products = await loadData();
    hideGate();
    finishInit();
  } catch (err) {
    console.error(err);
    if (String(err.message || '').includes('密語錯誤')) {
      // 密語本身錯誤：清掉存錯的值，讓使用者重新輸入
      localStorage.removeItem(GATE_TOKEN_KEY);
      showGateForm('密語錯誤，請重新輸入');
    } else {
      // 網路或其他連線問題：不清密語（可能只是暫時連不上），讓使用者重試
      showGateForm('連線失敗，請確認網路後再試一次');
    }
  }
}

// 使用者在輸入框按下「登入」
async function submitGateToken() {
  const input = document.getElementById('gateInput');
  const token = input.value.trim();
  if (!token) {
    document.getElementById('gateError').textContent = '請輸入密語';
    document.getElementById('gateError').style.display = 'block';
    return;
  }
  localStorage.setItem(GATE_TOKEN_KEY, token);

  document.getElementById('gateForm').style.display = 'none';
  document.getElementById('gateChecking').style.display = 'flex';

  await tryLoadAndEnter();
}

// ⚠️ 測試用：清除密語（上線前刪除，見 CSS／HTML 對應註解）
function devClearGateToken() {
  localStorage.removeItem(GATE_TOKEN_KEY);
  location.reload();
}

// ════════════════════════════════════
// Init
// ════════════════════════════════════
(async () => {
  document.getElementById('gateInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submitGateToken();
  });

  if (getStoredToken()) {
    // 已有存好的密語：靜默嘗試驗證，成功就直接進站，不用使用者再輸入一次
    await tryLoadAndEnter();
  } else {
    showGateForm();
  }
})();
</script>
